models:
  - id: qwen3-8b
    name: "Qwen3-8B-Q4_K_M"
    model_path: "./models/Qwen3-8B-Q4_K_M.gguf"
    server_port: 8001
    server_type: "llama-server"
    auto_start: true
    gpu_layers: 99
    gpu_mode: auto             # auto | gpu | cpu
    capabilities: ["reasoning", "general"]
    priority: 1
    min_vram_gb: 5
    context_length: 16384

  - id: gemma-4-12b
    name: "Gemma 4 12B IT"
    model_path: "./models/gemma-4-12b-it-Q4_K_M.gguf"
    server_port: 8002
    server_type: "llama-server"
    auto_start: false
    gpu_layers: 99
    gpu_mode: auto             # auto | gpu | cpu
    capabilities: ["coding", "vision", "reasoning", "general"]  # covers all tasks when acting as fallback
    priority: 2
    min_vram_gb: 8
    context_length: 8192
    extra_args: ["--jinja"]    # required for gemma-4 unified architecture chat templates
  - id: nomic-embed
    name: "Nomic Embed Text v1.5"
    model_path: "./models/nomic-embed-text-v1.5.Q8_0.gguf"
    server_port: 8003
    server_type: "llama-server"
    auto_start: true
    gpu_layers: 99
    gpu_mode: auto
    capabilities: ["embedding"]
    priority: 1
    min_vram_gb: 1
    context_length: 8192
