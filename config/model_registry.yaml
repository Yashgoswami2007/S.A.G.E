models:
  - id: qwen3-8b
    name: "Qwen3-8B-Q4_K_M"
    model_path: "./models/Qwen3-8B-Q4_K_M.gguf"
    server_port: 8001
    server_type: "llama-server"
    auto_start: true
    gpu_layers: 99
    gpu_layers_policy: auto        # "auto" | "all" | "none" | integer
    estimated_size_mb: 5000        # ~5 GB Q4_K_M — used for VRAM-aware auto sizing
    capabilities: ["reasoning", "general"]
    priority: 1
    min_vram_gb: 5
    context_length: 8192
    fallback_model_id: "gemma-4-12b"   # loaded automatically if qwen3-8b fails

  - id: gemma-4-12b
    name: "Gemma 4 12B IT"
    model_path: "./models/gemma-4-12b-it-Q4_K_M.gguf"
    server_port: 8002
    server_type: "llama-server"
    auto_start: false
    gpu_layers: 99
    gpu_layers_policy: auto        # "auto" | "all" | "none" | integer
    estimated_size_mb: 7500        # ~7.5 GB Q4_K_M — used for VRAM-aware auto sizing
    capabilities: ["coding", "vision", "reasoning", "general"]  # covers all tasks when acting as fallback
    priority: 2
    min_vram_gb: 8
    context_length: 8192
