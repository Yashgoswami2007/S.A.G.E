[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-backend"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench (SAGE)"
authors = [
    {name = "MRPL Team"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.1",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    # Document reading
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    # OCR
    "pytesseract>=0.3.10",
    # Document generation
    "docxtpl>=0.18.0",
    "python-pptx>=1.0.0",
    # PDF generation (Markdown → HTML → PDF)
    "markdown>=3.5.0",
    "xhtml2pdf>=0.2.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.1"
]
