[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-cli"
version = "0.1.0"
description = "Command Line Interface for SAGE Workbench"
authors = [
    {name = "MRPL Team"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1"
]

[project.scripts]
sage = "sage_cli.main:app"
